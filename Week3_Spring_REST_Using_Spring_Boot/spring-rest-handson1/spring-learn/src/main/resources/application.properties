# ================================================================
# Exercise 1: Spring Boot server configuration
# ================================================================
server.port=8080

# ================================================================
# Exercise 3: Logging configuration
# ================================================================

# Spring framework logs at INFO level (avoids excessive noise)
logging.level.org.springframework=info

# Our application logs at DEBUG level (shows all our debug statements)
logging.level.com.cognizant.springlearn=debug

# Log pattern:
#   %d{yyMMdd}              — date (year, month, day)
#   %d{HH:mm:ss.SSS}        — time with milliseconds
#   %-20.20thread            — thread name (max 20 chars)
#   %5p                     — log level (padded to 5)
#   %-25.25logger{25}        — logger name (max 25 chars)
#   %25M                    — method name (padded to 25)
#   %m%n                    — message + newline
logging.pattern.console=%d{yyMMdd}|%d{HH:mm:ss.SSS}|%-20.20thread|%5p|%-25.25logger{25}|%25M|%m%n
