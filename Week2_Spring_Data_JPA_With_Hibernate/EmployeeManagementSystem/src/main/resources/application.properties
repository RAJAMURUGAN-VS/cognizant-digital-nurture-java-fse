# ================================================================
# Exercise 1: H2 In-Memory Database Configuration
# ================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ================================================================
# Exercise 10: Hibernate dialect and performance properties
# ================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================================================
# Exercise 10: Batch processing configuration
# ================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ================================================================
# Exercise 1: H2 Console (http://localhost:8080/h2-console)
# ================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================================================
# Exercise 9: Externalized configuration
# ================================================================
app.datasource.primary.url=jdbc:h2:mem:testdb
app.datasource.primary.username=sa
app.datasource.primary.password=password

# ================================================================
# Server
# ================================================================
server.port=8080
logging.level.com.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
