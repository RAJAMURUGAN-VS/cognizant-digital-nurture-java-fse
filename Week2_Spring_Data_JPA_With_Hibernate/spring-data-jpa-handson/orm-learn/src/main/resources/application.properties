# ================================================================
# Spring Framework and application log
# ================================================================
logging.level.org.springframework=info
logging.level.com.cognizant=debug

# Hibernate logs for displaying executed SQL, input and output
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Log pattern
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} %-20.20thread %5p %-25.25logger{25} %25M %4L %m%n

# ================================================================
# Database configuration  — MySQL
# Update username/password to match your local MySQL installation
# ================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ormlearn?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ================================================================
# Hibernate configuration
# ddl-auto options: create | create-drop | update | validate
#   validate  - checks table/column exist; throws if missing (production safe)
#   update    - creates missing tables/columns automatically
# ================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show formatted SQL in console (already covered by hibernate.SQL=trace above)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
