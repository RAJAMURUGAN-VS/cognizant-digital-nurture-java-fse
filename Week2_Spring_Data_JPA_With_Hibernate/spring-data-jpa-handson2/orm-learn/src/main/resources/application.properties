# ================================================================
# Spring Framework and application log
# ================================================================
logging.level.org.springframework=info
logging.level.com.cognizant=debug

# Hibernate SQL logs
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Log pattern
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} %-20.20thread %5p %-25.25logger{25} %25M %4L %m%n

# ================================================================
# MySQL Database configuration
# Update username/password for your local MySQL setup
# ================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ormlearn?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ================================================================
# Hibernate configuration
# validate - checks table/column exist (use after tables are created)
# update   - creates missing tables/columns automatically
# ================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
