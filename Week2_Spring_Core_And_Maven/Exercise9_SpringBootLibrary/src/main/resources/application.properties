# ===================================================
# Exercise 9: Spring Boot Application Properties
# ===================================================

# Server port
server.port=8080

# -----------------------------------------------
# H2 In-Memory Database Configuration
# -----------------------------------------------
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------
# Hibernate dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: schema is created on startup, dropped on shutdown
# Use 'update' to retain data across restarts
spring.jpa.hibernate.ddl-auto=create-drop

# Print SQL statements to console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------
# H2 Console (accessible at http://localhost:8080/h2-console)
# -----------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------
# Logging
# -----------------------------------------------
logging.level.com.library=DEBUG
logging.level.org.springframework=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-40logger{40} - %msg%n
